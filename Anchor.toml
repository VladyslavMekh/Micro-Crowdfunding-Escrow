[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.10"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
micro_crowdfunding_escrow = "29ixMA7TLbTwbfaVotcXT21SaZdkS3Yt4erVjxVYFzvT"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false
